packages:
  - "apps/*"
  - "packages/*"

# One version per dependency across the workspace. Packages reference these as
# "catalog:" so a bump is a single edit, not 4.
catalog:
  "@eslint/js": 9.39.5
  "@types/node": 26.6.6
  "@types/react": 19.3.0
  "@types/react-dom": 19.3.0
  "@vitejs/plugin-react": 6.3.0
  eslint: 9.39.5
  eslint-config-prettier: 10.1.8
  prettier: 3.10.1
  react: 19.3.1
  react-dom: 19.3.1
  typescript: 5.9.3
  typescript-eslint: 8.73.0
  vite: 8.3.8
  vitest: 5.1.0
  zod: 4.6.7

minimumReleaseAgeExclude:
  - "@turbo/darwin-64@2.11.12"
  - "@turbo/darwin-arm64@2.11.12"
  - "@turbo/linux-64@2.11.12"
  - "@turbo/linux-arm64@2.11.12"
  - "@turbo/windows-64@2.11.12"
  - "@turbo/windows-arm64@2.11.12"
  - turbo@2.11.12

# pnpm 12 blocks dependency build scripts by default. The Prisma CLI and its
# schema engine need theirs; nothing else in this workspace does.
allowBuilds:
  "@prisma/engines": true
  prisma: true
