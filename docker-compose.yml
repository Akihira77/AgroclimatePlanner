# Development database only. Production runs on a managed instance.
#
# Port 5442 rather than 5432: the dev host already runs unrelated PostgreSQL
# containers on 5432 and 5433, and a silently-wrong database is worse than an
# unusual port number.
services:
  db:
    image: postgis/postgis:18-3.6
    container_name: agroclimate-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-agroclimate}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-agroclimate-dev}
      POSTGRES_DB: ${POSTGRES_DB:-agroclimate}
      # Timestamps are stored as timestamptz and rendered by the client; a
      # server-local default only makes logs harder to compare.
      TZ: UTC
      PGTZ: UTC
    ports:
      # Loopback only. A development database has no business accepting
      # connections from the rest of the network.
      - "127.0.0.1:${POSTGRES_PORT:-5442}:5432"
    volumes:
      # PostgreSQL 18 images moved PGDATA under /var/lib/postgresql/18/docker
      # and declare the volume at /var/lib/postgresql, not .../data.
      - db-data:/var/lib/postgresql
    command:
      - postgres
      - -c
      - timezone=UTC
      - -c
      - log_timezone=UTC
      - -c
      - log_statement=none
      - -c
      - max_connections=50
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U ${POSTGRES_USER:-agroclimate} -d ${POSTGRES_DB:-agroclimate}
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 15s

volumes:
  db-data:
